<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Lubango Arts for film and television production inquiries in Zambia.">
    <title>Contact - Lubango Arts</title>
    <link rel="icon" type="image/png" href="assets/images/logo_1763362568908.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/images/logoWithText_1763362568908.png" alt="Lubango Arts" class="logo-img">
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Work</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link active">Contact</a>
            </div>
            <button class="menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main class="main contact-main">
        <section class="contact-hero">
            <h1 class="contact-title">Let's Work Together</h1>
            <p class="contact-subtitle">Have a project in mind? We'd love to hear from you.</p>
        </section>

        <section class="contact-content">
            <div class="contact-grid">
                <div class="contact-info">
                    <div class="info-block">
                        <h3>Location</h3>
                        <p>Lusaka, Zambia</p>
                    </div>

                    <div class="info-block">
                        <h3>Connect</h3>
                        <div class="social-list">
                            <a href="https://www.facebook.com/lubangoarts" target="_blank">Facebook</a>
                            <a href="https://www.instagram.com/lubangoarts" target="_blank">Instagram</a>
                            <a href="https://www.youtube.com/@lubangoarts" target="_blank">YouTube</a>
                            <a href="https://x.com/lubangoarts" target="_blank">X</a>
                            <a href="https://zm.linkedin.com/in/nancyhandabile" target="_blank">LinkedIn</a>
                        </div>
                    </div>
                </div>

                <form class="contact-form" id="contactForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="company">Company</label>
                        <input type="text" id="company" name="company">
                    </div>

                    <div class="form-group">
                        <label for="service">Service Interest</label>
                        <select id="service" name="service" required>
                            <option value="">Select a service</option>
                            <option value="film">Film Production</option>
                            <option value="tv">Television Series</option>
                            <option value="reality">Reality TV</option>
                            <option value="commercial">Commercial</option>
                            <option value="digital">Digital Content</option>
                            <option value="voice">Voice & Audio</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Send Message</button>
                    <div id="formMessage" class="form-message"></div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-left">
                <p>&copy; 2025 Lubango Arts Limited</p>
                <p>Lusaka, Zambia</p>
                <p class="footer-designer">Designed & Built by Milimo Mukkuli</p>
            </div>
            <div class="footer-social">
                <a href="https://www.facebook.com/lubangoarts" target="_blank">Facebook</a>
                <a href="https://www.instagram.com/lubangoarts" target="_blank">Instagram</a>
                <a href="https://www.youtube.com/@lubangoarts" target="_blank">YouTube</a>
                <a href="https://x.com/lubangoarts" target="_blank">X</a>
                <a href="https://zm.linkedin.com/in/nancyhandabile" target="_blank">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
